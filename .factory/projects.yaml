# Synthetic CI profiles, read by factory-ci on every run (PLAN.md, Component 6).
# Projects not listed use `default`. WI-11 replaces this with the full placeholder project list.
projects:
  default: { duration_p50: 30s, duration_p95: 60s, flake_rate: 0.0 }
