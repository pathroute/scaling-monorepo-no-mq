# Post-merge synthetic CI on main: same logic as ci.yml on the pushed commit. Feeds the revert bot.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.sha }}

jobs:
  result:
    name: main/result
    runs-on: [self-hosted, synth]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Synthetic CI
        run: factory-ci
