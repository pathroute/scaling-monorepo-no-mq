# Synthetic CI (PLAN.md, Component 4). factory-ci is built into the synth runner image.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  result:
    # Required check name; must match REQUIRED_CHECK in infra/github/config.env.
    name: ci/result
    # Self-hosted runners on a public repo: only same-repo branches and merge queue runs reach them.
    # (A skipped job on a fork PR does not run anything; fork PRs are never merged in this experiment.)
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, synth]
    timeout-minutes: 50
    steps:
      # Depth 1 is enough: factory-ci fetches the base commit itself and only diffs trees.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # Decides pass/fail and duration from .factory/ in this tree; no retries (flakes are measured raw).
      - name: Synthetic CI
        run: factory-ci
